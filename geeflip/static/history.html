<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GEEFLIP — History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="app page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>GEEFLIP</h1>
          <p>Winner history</p>
        </div>
      </div>
      <nav class="nav">
        <a href="/">Scrape</a>
        <a href="/asins">ASINs</a>
        <a href="/history" class="active">History</a>
        <a href="/admin">Admin</a>
      </nav>
    </header>
    <main class="stage full">
      <section class="page-toolbar">
        <div>
          <h2>Winning listings</h2>
          <p id="history-count">Newest scrapes first</p>
        </div>
      </section>
      <section class="sheet">
        <div class="winner-list tall" id="history-body">
          <p class="empty-note">Loading…</p>
        </div>
        <div class="pager">
          <button type="button" class="text-btn" id="history-prev">Previous</button>
          <span id="history-page">—</span>
          <button type="button" class="text-btn" id="history-next">Next</button>
        </div>
      </section>
    </main>
  </div>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/history.js"></script>
</body>
</html>
